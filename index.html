<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EEG Recorder</title>
    <link rel="icon" href="/images/favicon.ico" />
    <link rel="stylesheet" href="/css/app.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Quicksand', sans-serif; }
    </style>
  </head>
  <body>
    <div class="position-fixed top-0 start-0 m-3 text-center">
      <img src="/images/brain.png" alt="Brain Logo" width="50" height="50" />
      <div class="mt-1 small">EEG Recorder</div>
    </div>

    <div id="user-chrome" class="position-fixed top-0 end-0 m-3" hidden>
      <span>Welcome <span id="welcome-username"></span></span>
      <a href="/logout" class="btn btn-sm btn-outline-secondary ms-2">Logout</a>
    </div>

    <div class="content-wrapper pt-5 mt-4">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-10 text-center">
            <div id="outer">
              <div class="inner">
                <button type="button" id="connect">
                  <span class="glyphicon glyphicon-off"></span>Connect
                </button>
              </div>
              <div class="inner">
                <button type="button" id="toggle_record">
                  <span id="record_button">Start Recording</span>
                </button>
              </div>
            </div>

            <div id="headsets"></div>

            <div id="status"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="footer"><p>EEG Recorder version 0.2</p></div>

    <template id="headset-template">
      <div class="headset" style="display: none">
        <div>
          <p>
            Name: <span class="headset-name">NA</span>,
            <span>Battery: <span class="battery-level">NA</span></span>,
            <span>Frame Rate: <span class="framerate">NA</span></span>,
            <span>
              Accel:
              x=<span class="acc-x">NA</span>,
              y=<span class="acc-y">NA</span>,
              z=<span class="acc-z">NA</span>
            </span>,
            <span>Blink Status: <span class="blink-status">NA</span></span>
          </p>
        </div>
        <div class="electrode-section">
          <div class="electrode-item">
            <h4><span class="electrode-name" data-ch="0">E1</span> RMS: <span class="rms" data-ch="0">NA</span></h4>
            <canvas class="electrode" data-ch="0"></canvas>
          </div>
          <div class="electrode-item">
            <h4><span class="electrode-name" data-ch="1">E2</span> RMS: <span class="rms" data-ch="1">NA</span></h4>
            <canvas class="electrode" data-ch="1"></canvas>
          </div>
          <div class="electrode-item">
            <h4><span class="electrode-name" data-ch="2">E3</span> RMS: <span class="rms" data-ch="2">NA</span></h4>
            <canvas class="electrode" data-ch="2"></canvas>
          </div>
          <div class="electrode-item">
            <h4><span class="electrode-name" data-ch="3">E4</span> RMS: <span class="rms" data-ch="3">NA</span></h4>
            <canvas class="electrode" data-ch="3"></canvas>
          </div>
        </div>
      </div>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
